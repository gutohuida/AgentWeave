[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentweave-ai"
version = "1.1.0"
description = "A local app for multi-agent, spec-driven development with Claude and Codex"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "gutohuida"},
]
keywords = ["claude", "codex", "collaboration", "agents", "ai", "code", "multi-agent", "spec-driven"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# 3.11, matching the Hub. The old `>=3.8` had stopped being true well before it was changed: the
# CLI's only job is to start the Hub, the Hub has always required 3.11, so a 3.8 user could install
# this package and then not run the product. `dependencies` below makes that unsatisfiable rather
# than merely misleading.
requires-python = ">=3.11"
# AgentWeave is one product. `pip install agentweave-ai` used to give you a CLI whose primary entry
# point — bare `agentweave`, which starts the Hub and opens the app window — could not work, because
# the Hub was a second package you had to know to install. There is no cycle: hub/hub/ never imports
# agentweave at runtime.
dependencies = ["agentweave-hub>=1.1.0"]

[project.optional-dependencies]
# The `python_version >= '3.10'` markers that used to guard fastmcp are gone with the 3.11 floor —
# there is no longer an interpreter in range that cannot have it.
mcp = ["fastmcp>=2.0", "pyyaml>=6.0"]
jobs = ["croniter>=2.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    # Upper bounds on the three tools CI *gates* on. Unpinned, a new major breaks
    # the build with no code change: black 26's style reformatted 78 files, which
    # was discovered as a CI failure rather than as a deliberate upgrade.
    "black>=23.0,<27",
    "ruff>=0.1.0,<0.16",
    "mypy>=1.0,<3",
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
    # Only for test_cli.py's icon-asset test, which opens the packaged .ico to confirm it's a
    # real multi-size image rather than a stub. Not a runtime dependency of anything shipped.
    "Pillow>=10.0",
]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5"]
# Genuinely optional: `_open_app_window_native` (cli.py) imports it inside a guarded try at its one
# call site, never at module load, so `dependencies = []` above stays true without this extra.
app = ["pywebview>=5.0"]
all = ["fastmcp>=2.0", "croniter>=2.0", "pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/gutohuida/AgentWeave"
Documentation = "https://gutohuida.github.io/AgentWeave/"
Repository = "https://github.com/gutohuida/AgentWeave"
Issues = "https://github.com/gutohuida/AgentWeave/issues"
Changelog = "https://github.com/gutohuida/AgentWeave/blob/master/CHANGELOG.md"

[project.scripts]
agentweave = "agentweave.cli:main"
aw = "agentweave.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentweave = ["templates/*", "templates/skills/*", "assets/*"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.ruff]
line-length = 100
# Stated rather than inferred from `requires-python`, so that raising the floor again does not
# silently switch on another batch of pyupgrade rules mid-release.
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
# The `UP` entries are a deliberate deferral, not a disagreement. Raising the floor from 3.8 to
# 3.11 in 1.0.0 made ruff propose 310 modernisations at once — 204 `typing.Dict` → `dict`
# (UP035), 92 `timezone.utc` → `datetime.UTC` (UP017), 13 `asyncio.TimeoutError` → `TimeoutError`
# (UP041), one str-enum (UP042). Every one is correct and none is a bug, but 310 mechanical edits
# across the codebase in the same change as a release is risk with no reader benefit, and 204 of
# them are not auto-fixable. Modernise in its own change, deleting these entries as each is done.
ignore = ["E501", "UP045", "UP006", "UP037", "UP035", "UP017", "UP041", "UP042"]

[tool.ruff.lint.per-file-ignores]
# Stacked `with patch(...)` is the idiomatic shape for these tests. Parenthesized context managers
# are available on the 3.11 floor, so this is now a style preference rather than the compatibility
# requirement it originally was — kept because rewriting hundreds of stacked blocks to satisfy
# SIM117 would be churn with no reader benefit.
"tests/**" = ["SIM117"]
"hub/tests/**" = ["SIM117"]

[tool.ruff.lint.isort]
# Both distributions are first-party here; without this, `hub` and `agentweave`
# absolute imports get sorted into the third-party block.
known-first-party = ["agentweave", "hub"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are evaluated once at import time by
# design — calling them in argument defaults is the documented idiom, not the
# B008 mutable-default trap. Hub route signatures use them throughout.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Security",
]

[tool.mypy]
# Now simply the package's runtime floor. This used to be a compromise: the floor was 3.8 but
# mypy 2 refuses to target anything below 3.10, so the two disagreed and the gap was covered by
# running pytest on the 3.8/3.9 matrix legs. With the floor at 3.11 there is nothing to reconcile.
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = true
exclude = ["src/agentweave/mcp"]

# alembic is lazily imported (only on the native start path, and provided by agentweave-hub)
# and ships no type stubs for mypy to resolve.
[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
