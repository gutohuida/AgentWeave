[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentweave-ai"
version = "0.42.0"
description = "Multi-agent AI collaboration framework (Claude, Kimi, Gemini, Codex, and more)"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "gutohuida"},
]
keywords = ["claude", "kimi", "gemini", "codex", "collaboration", "agents", "ai", "code", "multi-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
mcp = ["fastmcp>=2.0; python_version >= '3.10'", "pyyaml>=6.0"]
jobs = ["croniter>=2.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    # Upper bounds on the three tools CI *gates* on. Unpinned, a new major breaks
    # the build with no code change: black 26's style reformatted 78 files and
    # mypy 2 refused `python_version = "3.8"` outright, both discovered as CI
    # failures rather than as a deliberate upgrade. Floors stay low so the 3.8/3.9
    # matrix legs can still resolve `.[dev]` — lint only runs on the 3.11 leg.
    "black>=23.0,<27",
    "ruff>=0.1.0,<0.16",
    "mypy>=1.0,<3",
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5"]
all = ["fastmcp>=2.0; python_version >= '3.10'", "croniter>=2.0", "pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/gutohuida/AgentWeave"
Documentation = "https://gutohuida.github.io/AgentWeave/"
Repository = "https://github.com/gutohuida/AgentWeave"
Issues = "https://github.com/gutohuida/AgentWeave/issues"
Changelog = "https://github.com/gutohuida/AgentWeave/blob/master/CHANGELOG.md"

[project.scripts]
agentweave = "agentweave.cli:main"
aw = "agentweave.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentweave = ["templates/*", "templates/skills/*"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501", "UP045", "UP006", "UP037"]

[tool.ruff.lint.per-file-ignores]
# Stacked `with patch(...)` is the idiomatic shape for these tests, and the CLI
# suite must run on 3.8/3.9, which have no parenthesized context managers — so
# "combine into one `with`" means a single overlong line or backslash
# continuations, both worse than the nesting SIM117 objects to.
"tests/**" = ["SIM117"]
"hub/tests/**" = ["SIM117"]

[tool.ruff.lint.isort]
# Both distributions are first-party here; without this, `hub` and `agentweave`
# absolute imports get sorted into the third-party block.
known-first-party = ["agentweave", "hub"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are evaluated once at import time by
# design — calling them in argument defaults is the documented idiom, not the
# B008 mutable-default trap. Hub route signatures use them throughout.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Security",
]

[tool.mypy]
# Not the package's runtime floor, which stays at `requires-python = ">=3.8"`.
# mypy 2 refuses to target anything below 3.10 ("Python 3.8 is not supported"),
# so this is the lowest version it will accept. Actual 3.8/3.9 compatibility is
# covered by the CI test matrix, which runs pytest on both.
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = true
exclude = ["src/agentweave/mcp"]

# alembic is an optional, lazily-imported dependency (only needed for
# `agentweave hub start`'s native mode, provided by the separate agentweave-hub
# package) and ships no type stubs for mypy to resolve.
[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
