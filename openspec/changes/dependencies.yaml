# openspec/changes/dependencies.yaml
#
# Change ordering for the autonomous dev loop initiative.
# A change is "ready to apply" once every change in an earlier phase is
# archived (moved into openspec/changes/archive/).
#
# See each change's proposal.md for the rationale behind the order.

schema: dependencies-v1

phases:
  - id: investigate
    sequence: 1
    parallel: false
    description: >
      Ship findings documents for the three runtime blockers. No code
      changes. The findings are the source of truth that the next phase
      reads from. Until this phase is archived, no fix should be
      designed.
    changes:
      - investigate-blockers

  - id: fix-blockers
    sequence: 2
    parallel: true
    description: >
      Three independent fixes. Each reads the approved findings from
      phase 1 and designs and implements its specific fix. The three
      fixes can be worked in parallel because they touch different parts
      of the codebase (context pipeline, auto-reset, watchdog retry).
    changes:
      - fix-context-tracking
      - add-auto-reset-mode
      - add-durable-trigger-retry

  - id: build-loop
    sequence: 3
    parallel: false
    description: >
      Final integration. Stands up the dev Hub on port 8001 with its
      own database, the three per-agent worktrees, the kickoff jobs,
      the role configuration, and the operator runbook. Only starts
      after all three fixes are archived, because the loop depends on
      every one of them.
    changes:
      - autonomous-dev-loop

# Reverse index: for any change, which other changes are blocked by it.
# Used by tooling (and humans) to answer "what does change X unblock?".
blocks:
  investigate-blockers:
    - fix-context-tracking
    - add-auto-reset-mode
    - add-durable-trigger-retry
  fix-context-tracking:
    - autonomous-dev-loop
  add-auto-reset-mode:
    - autonomous-dev-loop
  add-durable-trigger-retry:
    - autonomous-dev-loop
  autonomous-dev-loop: []

# Optional human notes. Free-form.
notes:
  - >
    Phase 1 (investigate-blockers) is expected to take longest because
    it requires manual observation and per-runner experiments. The
    findings are what unblock the parallel fix work in phase 2.
  - >
    The three phase-2 fixes do not share code paths, so parallel work
    is safe. If a finding in phase 1 implies that two fixes need to
    coordinate, pause one and merge the design first.
  - >
    Phase 3 (autonomous-dev-loop) is integration. It touches the
    docker-compose, transport config, role templates, and Hub task
    templates — but no business logic. It is the smallest change by
    code volume and the largest by operational surface area.