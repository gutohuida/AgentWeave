site_name: AgentWeave
site_description: Run your AI factory in the open. A local app where AI coding agents build against specifications you approve, and every artifact traces back to who made it and why.
site_author: gutohuida
site_url: https://gutohuida.github.io/AgentWeave/
repo_name: gutohuida/AgentWeave
repo_url: https://github.com/gutohuida/AgentWeave
edit_uri: edit/master/docs/

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn

theme:
  name: material
  logo: assets/agentweave-loop-on-dark.svg
  favicon: assets/agentweave-favicon.svg
  # The app's own type: DM Sans for text, JetBrains Mono for code (hub/ui/src/index.css).
  font:
    text: DM Sans
    code: JetBrains Mono
  # Brand colours (identity kit, 2026-10-22): ink header, verdigris accent, madder for the loop
  # only; see stylesheets/brand.css.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.tabs.link

extra_css:
  - stylesheets/brand.css

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      base_path: [docs/snippets]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Get started:
    - getting-started/installation.md
    - getting-started/quickstart.md
    - getting-started/concepts.md
  - Guides:
    - guides/the-app.md
    - guides/agents.md
    - guides/conversations.md
    - guides/specifications.md
    - guides/tasks-and-review.md
    - guides/jobs-loops-flows.md
    - guides/knowledge-vault.md
    - guides/traceability.md
    - guides/docker.md
  - Reference:
    - reference/cli-commands.md
    - reference/agent-tools.md
    - reference/permission-postures.md
    - reference/task-lifecycle.md
    - reference/spec-documents.md
    - reference/project-files.md
    - reference/env-variables.md
    - reference/hub-api.md
    - reference/agent-stream-contract.md
  - Architecture:
    - architecture/overview.md
  - Contributing:
    - contributing/development.md
    - contributing/release-process.md
  - Archive:
    - 2026 Q2 Hardening:
      - archive/2026-q2-hardening/index.md
      - Changes: archive/2026-q2-hardening/changes.md
    - Autonomous Dev Loop (shelved):
      - archive/autonomous-dev-loop/index.md

# The legacy multi-runtime documentation is kept in git for history but is no longer published.
# It describes the watchdog, the local and git transports, the role subsystem and the multi-runtime
# CLI — every one of which was deleted before 1.0.0. Its 28 cross-links resolve to pages that no
# longer exist, and repairing them would only make a deleted product's manual navigable. Read it at
# docs/archive/legacy-multi-runtime/ in the repository if you need to know how the old shape worked.
exclude_docs: |
  archive/legacy-multi-runtime/
  snippets/

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/gutohuida/AgentWeave
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/agentweave-ai/

copyright: Copyright &copy; 2025–2026 gutohuida — MIT License
