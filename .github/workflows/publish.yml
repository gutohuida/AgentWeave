name: Publish to PyPI

on:
  release:
    types: [created]

jobs:
  publish:
    # One product, one tag: `v*` publishes BOTH distributions. The exclusion of `hub-v` prefixed
    # tags that used to live here is gone with the scheme itself.
    if: startsWith(github.ref, 'refs/tags/v')
    # The Hub must reach PyPI first. `agentweave-ai` depends on `agentweave-hub>=<this version>`,
    # so if the CLI won the race there would be a window — however short — in which
    # `pip install agentweave-ai` resolves to a version whose dependency does not exist yet.
    # Ordering the jobs costs one sequential upload and removes the window entirely.
    needs: publish-hub
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build package
      run: |
        python -m build
    
    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        twine upload dist/*

  publish-hub:
    # Same gate as `publish` above — the two distributions ship together from one tag. If only one
    # of these jobs runs on a release, this re-gating is wrong and is the first thing to fix.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node 20
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Build React UI
      working-directory: hub/ui
      run: |
        npm ci
        npm run build

    - name: Copy built UI into hub package
      run: |
        mkdir -p hub/hub/static/ui
        cp -r hub/ui/dist/. hub/hub/static/ui/

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build hub package
      working-directory: hub
      run: |
        python -m build

    - name: Publish hub to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: hub/dist
