name: Upstream drift

# The alarm `constraints-dev.txt` silenced (F308, operator's call 2026-09-22).
#
# Both `ci.yml` test jobs install through `-c constraints-dev.txt`, which is what makes a local
# install land on CI's resolution (`DECISIONS.md` DAY-1). The cost is that no job installs the
# loose range `pyproject.toml` still advertises to users. The 2026-09-09 starlette break was found
# because CI resolved fresh; after the pins, that class of break is caught by nothing. An image
# build on master would catch an *import* failure, and runs no tests.
#
# So this job resolves fresh, weekly, and runs the suites. Deliberately NOT part of `ci.yml`:
#
#   * The merge gate requires a `success` for the workflow named `CI` at HEAD's sha
#     (`.claude/loops/day-window.md`). This workflow has a different name, so a red run here
#     never blocks a merge and never turns anyone's commit red.
#   * What it reports is "upstream moved and something broke", which is nobody's commit. It is
#     read when it fires, not gated on.
#
# `tests/test_dev_constraints.py` asserts this file exists, is scheduled, and installs WITHOUT
# `-c` -- the one place in the repository where a missing `-c` is the point rather than the bug.
#
# **It fires only once `master` has it.** GitHub reads `schedule` and `workflow_dispatch` from the
# default branch only, so while this lives on the cycle branch it never runs and cannot be
# dispatched. That is the operator's merge, not this window's.

on:
  schedule:
    # Mondays, 07:00 UTC. Far from the daily loop's windows (night ~23:00, day ~09:00 local).
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unpinned:
    name: Fresh resolution of the published range
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install without constraints-dev.txt
      # No `-c`, on purpose: this is the resolution a user gets from the published ranges today.
      run: |
        python -m pip install --upgrade pip
        pip install -e "./hub[dev]"
        pip install -e ".[dev]"
        pip check

    - name: Record what resolved
      # Written to the run summary so a green run still says which versions it proved, which is
      # what tells a reader that the pins are behind and by how much.
      run: |
        {
          echo '### Resolved versions (no constraints)'
          echo '```'
          pip freeze | grep -Ei '^(starlette|fastapi|sqlalchemy|pydantic|uvicorn|httpx|anyio)=='
          echo '```'
          echo '### Pinned in constraints-dev.txt'
          echo '```'
          grep -Ev '^\s*(#|$)' constraints-dev.txt
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Hub suite
      # The behaviour surface. An upstream release that breaks routing or request handling shows
      # up here and nowhere else; the Docker build catches only an import failure.
      working-directory: hub
      run: pytest tests/ -q --timeout=300 --timeout-method=thread

    - name: CLI suite
      run: pytest tests/ -q
