name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # The Hub goes in first, from this checkout, because `agentweave-ai` now depends on
        # `agentweave-hub` — one product, one install. Resolving that from PyPI here would
        # demand a version that only exists after this commit is released, so CI would need
        # the release to pass and the release would need CI to pass. Installing the local
        # copy first satisfies the requirement before pip ever looks outward.
        pip install -e ./hub
        pip install -e ".[dev]"

    - name: Lint with ruff
      if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
      run: |
        ruff check src/ hub/ tests/

    - name: Format check with black
      if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
      run: |
        black --check src/ hub/hub/ hub/tests/ tests/

    - name: Type check with mypy
      if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
      run: |
        mypy src/
    
    - name: Test with pytest
      run: |
        pytest tests/ -v --cov=agentweave --cov-report=xml
    
    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  hub-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Hub dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Install the CLI package
      # `working-directory: hub` is a job default, so this step overrides it to reach the repo
      # root. Four Hub tests import `agentweave` (test_agent_output_stream, test_session_sync,
      # test_task_transitions, test_agent_tool_surface_phase7); without this the job dies with
      # `ModuleNotFoundError: No module named 'agentweave'`, which is what it has been doing on
      # master since 2026-07-29. It passes locally only because the CLI happens to be installed
      # editable on the developer's machine.
      #
      # After the Hub, not before: `agentweave-ai` depends on `agentweave-hub`, and the step
      # above has already satisfied that from this checkout, so pip never reaches for a PyPI
      # version that does not exist until this commit ships.
      working-directory: .
      run: |
        pip install -e .

    - name: Test Hub with pytest
      run: |
        pytest tests/ -v

  ui-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub/ui

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: npm
        cache-dependency-path: hub/ui/package-lock.json

    - name: Install UI dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Type check
      run: npx tsc --noEmit

    - name: Test
      run: npm test

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build package
      run: |
        python -m build

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
