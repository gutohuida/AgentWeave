name: CI

on:
  push:
    # `autonomous/**` is here because the daily loop's cycle branch was otherwise invisible to CI.
    # The standing rule is "push, do not open PRs", so neither trigger below could ever fire for it:
    # between 2026-09-01 and 2026-09-03 the branch accumulated 173 commits across 114 files and was
    # never once built by anything but the loop running CI's commands on one Windows machine. The
    # morning merge gate in `.claude/loops/day-window.md` reads the conclusion of this run, so this
    # line is what makes an unattended merge to master defensible rather than a leap.
    branches: [ master, 'autonomous/**' ]
  pull_request:
    branches: [ master ]

# A newer master push cancels the older master run: interactive sessions push code and its
# bookkeeping back to back, and five full runs at once queued for runners. Every other ref gets a
# group of its own sha, so nothing is cancelled there -- and that is required, not caution: a
# shared group cancels a *pending* run even with cancel-in-progress off, and the loop's driver
# (`run-iteration.ps1`) reads `cancelled` on an `autonomous/**` sha as red.
concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/master' && 'tip' || github.sha }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/master' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 3.11 is the floor: `agentweave-ai` depends on `agentweave-hub`, which requires it.
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # The Hub goes in first, from this checkout, because `agentweave-ai` now depends on
        # `agentweave-hub` — one product, one install. Resolving that from PyPI here would
        # demand a version that only exists after this commit is released, so CI would need
        # the release to pass and the release would need CI to pass. Installing the local
        # copy first satisfies the requirement before pip ever looks outward.
        # `-c constraints-dev.txt` is what makes this job's resolution reproducible on a
        # developer's machine. Without it, `starlette<2.0` let CI resolve 1.6.0 while dev ran
        # 0.52.1, and a test reading `create_app().routes` saw 7 paths here and 161 there. The
        # file is development-only and narrows nothing about what the Hub supports -- see its
        # header, and `tests/test_dev_constraints.py`, which fails if this flag is dropped.
        # The Hub's `dev` extra brings pytest-xdist: the CLI tests drive `scripts/checks/hub_suite.py`
        # with `-n`, which pytest refuses ("unrecognized arguments: -n") without it.
        pip install -c constraints-dev.txt -e "./hub[dev]"
        pip install -c constraints-dev.txt -e ".[dev]"

    - name: Verify environment
      # `pip install` succeeding is not the same as the packages under test being importable
      # from THIS checkout, or the dependency graph being internally consistent -- both have
      # failed silently before (see openspec/explorations/2026-08-17-the-hub-suite-has-never-run-clean.md).
      # A dedicated, clearly-named step means a broken environment fails here, distinctly from
      # a real test failure, instead of surfacing as one more red result inside the pytest step.
      # `hub` is deliberately not imported here: from the repo root, a top-level `hub/` directory
      # shadows the installed `hub` package during import resolution (documented in CLAUDE.md's
      # "trial Hub" section) -- checking it from this cwd would fail for a reason unrelated to
      # what this step exists to catch. The `hub-test` job below checks it from `hub/`, where
      # that shadowing does not happen.
      run: |
        python -c "import agentweave; print('agentweave ->', agentweave.__file__)"
        pip check

    - name: Lint with ruff
      if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
      # scripts/ gets only the rules that catch bugs (syntax, undefined names, unused imports and
      # locals): refresh_ui_bundle.py runs behind `make ui` and nothing else in CI exercises
      # scripts/, while full style on the throwaway drive harnesses would be churn, not safety.
      run: |
        ruff check src/ hub/ tests/
        ruff check scripts/ --select E9,F63,F7,F82,F401,F841

    - name: Format check with black
      if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
      run: |
        black --check src/ hub/hub/ hub/tests/ tests/

    - name: Type check with mypy
      if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
      run: |
        mypy src/
    
    - name: Test with pytest
      run: |
        pytest tests/ -v --cov=agentweave --cov-report=xml
    
    - name: Upload coverage
      continue-on-error: true
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  hub-test-shard:
    # Split four ways (`scripts/checks/ci_shard.py`): as one job this was ~15 min, and with "the
    # PR's CI is the full check" on it is the wait before a PR is ready. Each shard runs whole
    # files with `-n auto`; `tests/test_ci_shard.py` fails if a file is in no shard or in two, or
    # if the count below and the script's argument disagree. The `hub-test` job after this one is
    # what the project's CI check names count -- keep that name.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: hub

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Hub dependencies
      # `../` because `working-directory: hub` is this job's default and the constraints file
      # lives at the repo root. Same rationale as the `test` job above.
      run: |
        python -m pip install --upgrade pip
        pip install -c ../constraints-dev.txt -e ".[dev]"

    - name: Install the CLI package
      # `working-directory: hub` is a job default, so this step overrides it to reach the repo
      # root. Four Hub tests import `agentweave` (test_agent_output_stream, test_session_sync,
      # test_task_transitions, test_agent_tool_surface_phase7); without this the job dies with
      # `ModuleNotFoundError: No module named 'agentweave'`, which is what it has been doing on
      # master since 2026-07-29. It passes locally only because the CLI happens to be installed
      # editable on the developer's machine.
      #
      # After the Hub, not before: `agentweave-ai` depends on `agentweave-hub`, and the step
      # above has already satisfied that from this checkout, so pip never reaches for a PyPI
      # version that does not exist until this commit ships.
      working-directory: .
      run: |
        pip install -c constraints-dev.txt -e .

    - name: Verify environment
      # Same rationale as the `test` job's step of the same name. This job runs from `hub/`
      # (the job default), so `hub` resolves to the installed package correctly here -- no
      # shadowing, unlike a check from the repo root.
      run: |
        python -c "import agentweave, hub; print('agentweave ->', agentweave.__file__); print('hub ->', hub.__file__)"
        pip check

    - name: Test Hub with pytest
      # --timeout turns a wedged test into a dumped stack and a failure in minutes instead of
      # a silent 6-hour job timeout (F394). "thread" kills the whole process, so it works
      # for a test blocked in a sqlite lock, where a signal would not be delivered; under xdist it
      # takes down only that worker, which xdist reports and replaces.
      #
      # -n auto: run serially, this step was the whole wall clock of CI (16-28 min). Each worker is
      # its own process with its own database (conftest.py's mkdtemp). `--dist loadgroup` with
      # conftest.py grouping every test by its file keeps a file whole and in order on one worker:
      # some files rely on an earlier test in the same file (test_scheduler.py's exhaustion tests,
      # F264), which `load` would split across workers. The files in conftest.py's
      # SPREAD_ACROSS_WORKERS are left ungrouped, so their tests go to whichever worker is free.
      # A failure that appears only here is a test-isolation bug: fix the test, do not drop -n.
      run: |
        python ../scripts/checks/ci_shard.py ${{ matrix.shard }} 4 > "$RUNNER_TEMP/shard.txt"
        echo "shard ${{ matrix.shard }} of 4: $(wc -l < "$RUNNER_TEMP/shard.txt") files"
        pytest $(cat "$RUNNER_TEMP/shard.txt") -v -n auto --dist loadgroup --timeout=300 --timeout-method=thread --durations=25

  hub-test:
    # The one result the shards report under: the name a project's "CI check names" lists (and
    # the name GitHub would mark required). `always()` so a failed or cancelled shard is reported
    # here as a failure, not skipped -- a skipped job reads as neither passed nor failed.
    runs-on: ubuntu-latest
    needs: hub-test-shard
    if: always()
    steps:
    - name: Every shard passed
      run: |
        echo "shards: ${{ needs.hub-test-shard.result }}"
        test "${{ needs.hub-test-shard.result }}" = "success"

  hub-judge-windows:
    # D9: the shell judge's drive-letter branches (`_DRIVE_LETTERS`, the drive-piece rule, the
    # Windows-only rows in test_the_shell_judge_reads_a_word_whole.py and
    # test_permission_approver.py) never ran on CI before this job -- only on this machine. Task
    # 2.2c, filed after iteration 59 found a Windows-only assertion that had never executed on a
    # non-Windows runner until the main hub-test job happened to catch it going the other way.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: hub

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Hub dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -c ../constraints-dev.txt -e ".[dev]"

    - name: Install the CLI package
      working-directory: .
      run: |
        pip install -c constraints-dev.txt -e .

    - name: Verify environment
      run: |
        python -c "import agentweave, hub; print('agentweave ->', agentweave.__file__); print('hub ->', hub.__file__)"
        pip check

    - name: Test the shell judge on Windows
      run: |
        pytest tests/test_permission_approver.py tests/test_the_shell_judge_reads_a_word_whole.py -v --timeout=300 --timeout-method=thread

    # F663: a junction in the calls directory is no link to `islink` and `rmtree` refuses one.
    - name: Test the calls directory's junction case on Windows
      run: |
        pytest tests/test_calls_dir_starts_clean.py -v --timeout=300 --timeout-method=thread

  ui-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub/ui

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: npm
        cache-dependency-path: hub/ui/package-lock.json

    - name: Install UI dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Type check
      run: npx tsc --noEmit

    - name: Test
      run: npm test

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build package
      run: |
        python -m build

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  # What a new user gets from `pip install agentweave-ai`: both wheels built from this commit,
  # installed into an empty venv with the *published* dependency ranges (no constraints-dev.txt,
  # deliberately -- a loose range that resolves to a breaking release is exactly what this catches),
  # then the CLI runs and the Hub starts, migrates a fresh database and serves its UI.
  clean-install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Build both wheels
      run: |
        python -m pip install --upgrade pip build
        python -m build --wheel --outdir dist/ .
        python -m build --wheel --outdir dist/ hub/

    - name: Install into an empty venv
      run: |
        python -m venv "$RUNNER_TEMP/clean"
        if [ -d "$RUNNER_TEMP/clean/Scripts" ]; then BIN="$RUNNER_TEMP/clean/Scripts"; else BIN="$RUNNER_TEMP/clean/bin"; fi
        echo "$BIN" >> "$GITHUB_PATH"
        "$BIN/python" -m pip install --upgrade pip
        "$BIN/python" -m pip install dist/agentweave_hub-*.whl dist/agentweave_ai-*.whl

    - name: The CLI runs
      run: |
        agentweave --version
        agentweave --help > /dev/null

    - name: The Hub starts on a fresh database and serves the UI
      env:
        AW_PORT: "8765"
      run: |
        export DATABASE_URL="sqlite+aiosqlite:///$(python -c "import pathlib,os; print(pathlib.Path(os.environ['RUNNER_TEMP'], 'clean.db').as_posix())")"
        agentweave-hub > "$RUNNER_TEMP/hub.log" 2>&1 &
        for i in $(seq 1 60); do
          if curl -fsS http://127.0.0.1:8765/health > "$RUNNER_TEMP/health.json" 2>/dev/null; then break; fi
          sleep 2
        done
        cat "$RUNNER_TEMP/health.json" || { cat "$RUNNER_TEMP/hub.log"; exit 1; }
        grep -q '"status":"ok"' "$RUNNER_TEMP/health.json" || { cat "$RUNNER_TEMP/hub.log"; exit 1; }
        curl -fsS http://127.0.0.1:8765/ | grep -qi "<html" || { echo "the UI bundle is not served"; cat "$RUNNER_TEMP/hub.log"; exit 1; }
