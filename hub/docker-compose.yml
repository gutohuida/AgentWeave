services:
  hub:
    # Prefer the locally-built `agentweave-hub:audit` image (built by
    # `make hub-full-build`) so audit-branch code is in use. Falls back
    # to the published v0.31.2 image if no local build exists.
    image: ${AW_HUB_IMAGE:-agentweave-hub:audit}
    ports:
      - "${AW_PORT:-8000}:8000"
    volumes:
      - hub-data:/app/data
      # Explicit workspace root: project directories are accepted only
      # beneath the container-visible AW_WORKSPACE_ROOT. Point
      # AW_WORKSPACE_HOST_ROOT at the host directory that holds your
      # projects; paths outside it are refused with a typed mount
      # diagnostic. The Hub never mounts the Docker socket or guesses
      # host/container path mappings.
      - ${AW_WORKSPACE_HOST_ROOT:-./workspaces}:/workspaces
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///data/agentweave.db
      - AW_WORKSPACE_ROOT=/workspaces
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  hub-data:
