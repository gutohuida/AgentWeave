# Pinned, so Compose stops deriving the project prefix from whatever directory you launched from.
# Without it the `hub-data` volume's real name is `<dirname>_hub-data`, which means the database you
# get depends on where you ran the command — the same directory-sensitive state bug that made bare
# `agentweave` feel like a different app per folder.
name: agentweave

services:
  hub:
    # The published image. `docker compose up -d` is the documented install
    # (docs/getting-started/installation.md), so this default has to be something a user can
    # actually pull; set AW_HUB_IMAGE to override with a local build.
    image: ${AW_HUB_IMAGE:-ghcr.io/gutohuida/agentweave-hub:latest}
    # No `build:` section, deliberately. The documented install has the user curl THIS FILE ALONE
    # into an empty directory — no Dockerfile, no source. Compose builds instead of pulling when a
    # service declares both `build` and `image` and the image is not already local, so adding one
    # would turn the primary install into a build failure. Building from source is
    #   docker build -t agentweave-hub:dev .
    #   AW_HUB_IMAGE=agentweave-hub:dev docker compose up -d
    # which is what AW_HUB_IMAGE exists for.
    ports:
      - "${AW_PORT:-8000}:8000"
    volumes:
      - hub-data:/app/data
      # Explicit workspace root: project directories are accepted only
      # beneath the container-visible AW_WORKSPACE_ROOT. Point
      # AW_WORKSPACE_HOST_ROOT at the host directory that holds your
      # projects; paths outside it are refused with a typed mount
      # diagnostic. The Hub never mounts the Docker socket or guesses
      # host/container path mappings.
      - ${AW_WORKSPACE_HOST_ROOT:-./workspaces}:/workspaces
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///data/agentweave.db
      - AW_WORKSPACE_ROOT=/workspaces
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  hub-data:
