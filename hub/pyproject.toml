[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentweave-hub"
version = "1.1.0"
# Installed as a dependency of `agentweave-ai`, not on its own — one product, one install.
description = "AgentWeave's local server and web interface (installed with agentweave-ai)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "alembic>=1.13",
    # Bounded 2026-09-01, defensively, after FastMCP 4.0.0 reached PyPI the evening before and
    # this unbounded pin let CI cross a major with nobody told. v4 requires pydantic>=2.12,
    # FastAPI>=0.133.0 and httpx2 — a transitive set this suite has never run against — so the
    # ceiling buys a conscious upgrade rather than a silent one, exactly as `starlette<2.0`
    # below does. `hub/tests/test_fastmcp_api_contract.py` names the APIs that must survive it.
    "fastmcp>=2.0,<4",
    "sse-starlette>=2.0",
    # starlette is transitive via fastapi, but pinned explicitly: an unbounded fastapi>=0.110
    # once let pip silently resolve starlette 1.6.0 in CI while dev ran 0.52.1, crossing a major
    # version boundary nobody had tested (openspec/explorations/2026-08-17-the-hub-suite-has-never-run-clean.md).
    # Both 0.52.1 and 1.6.0 are now verified compatible (hub/tests/_routing.py handles both route
    # shapes); the upper bound exists so an untested future 2.x needs a conscious bump, not a
    # silent one.
    "starlette<2.0",
    "croniter>=2.0",
    "apscheduler>=3.10",
    "pywinpty>=2.0; sys_platform == 'win32'",
    "ptyprocess>=0.7; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "pytest-xdist>=3.6"]

[project.scripts]
agentweave-hub = "hub.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["hub*"]

[tool.setuptools.package-data]
hub = [
    "alembic.ini",
    "data/charters/*.md",
    "data/charters/*.json",
    "migrations/env.py",
    "migrations/script.py.mako",
    "migrations/versions/*.py",
    "static/ui/**/*",
    "static/ui/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
