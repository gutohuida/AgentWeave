<!-- @dsCard group="Motion" height=200 subtitle="The thread weaves through while work loads" -->
<style>
  body { margin: 0; background: var(--bg, #0a0a0b); color: var(--text-2, #8e8e98); font: 12px system-ui, sans-serif; }
  .root { display: flex; flex-wrap: wrap; gap: 40px; align-items: center; padding: 28px; }
  figure { margin: 0; display: grid; gap: 10px; justify-items: center; }
  .thread path { fill: none; stroke: var(--madder, #cc4630); stroke-linecap: round; stroke-linejoin: round; animation: aw-weave-a 1.8s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
  .thread path.b, .thread mask path { animation-name: aw-weave-b; }
  .thread mask path { stroke: #000; }
  @keyframes aw-weave-a { 0% { stroke-dasharray: 0 2; stroke-dashoffset: 0 } 25%, 50% { stroke-dasharray: 1 2; stroke-dashoffset: 0 } 75% { stroke-dasharray: 0 2; stroke-dashoffset: -1 } 75.01%, 100% { stroke-dasharray: 0 2; stroke-dashoffset: -1.5 } }
  @keyframes aw-weave-b { 0%, 25% { stroke-dasharray: 0 2; stroke-dashoffset: -1.5 } 25.01% { stroke-dasharray: 0 2; stroke-dashoffset: 0 } 50%, 75% { stroke-dasharray: 1 2; stroke-dashoffset: 0 } 100% { stroke-dasharray: 0 2; stroke-dashoffset: -1 } }
  @media (prefers-reduced-motion: reduce) { .thread path { animation: none; stroke-dasharray: none; } }
</style>

      <path pathLength="1" stroke-width="5.5" d="M9 15 L21 50 L34 21 C38.6 12.5 37.6 6 32 6" mask="url(#lt-cut)"/>

    </svg>
